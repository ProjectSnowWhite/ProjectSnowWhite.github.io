<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Preview</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0c; --panel: rgba(18, 18, 20, 0.86); --ink: #e6e6e6; --muted: #9a9aa0; --line: #2a2a2e; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #bar button, #bar select { background: #1d1d21; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #bar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #time { flex: 1 1 200px; min-width: 120px; }
  #readout { position: fixed; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
             font: 12px/1.45 ui-monospace, monospace; white-space: pre; color: var(--muted); }
  #note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); pointer-events: none; }
  /* full screen where the browser cannot make a page full screen (an iPhone): the controls hidden, a small button brings them back */
  body.immersive #bar, body.immersive #readout { display: none; }
  #ui { position: fixed; right: 12px; top: 12px; display: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        border-radius: 8px; padding: 6px 10px; font: inherit; }
  body.immersive #ui { display: block; }
  body.nostats #readout { display: none; }
</style>

<style>#readout,#stats{display:none!important}</style>
</head>
<body class="nostats">
<canvas id="view" tabindex="0" aria-label="The cube, drawn live"></canvas>
<div id="readout" aria-live="polite"></div>
<div id="note">Loading ...</div>
<div id="bar">
  <button id="play" type="button" aria-pressed="true">Pause</button>
  <input id="time" type="range" min="0" max="0" step="0.01" value="0" aria-label="The moment">
  <label>Camera <select id="cam" aria-label="Go to one of the original cameras"></select></label>
  <label>Render <select id="scale" aria-label="Render resolution: Auto (the render governor) or a fixed share of the screen's own pixels">
    <option value="auto" selected>Auto</option><option value="0.5">50 %</option><option value="0.75">75 %</option><option value="1">100 %</option>
    <option value="1.5">150 %</option><option value="2">200 %</option></select></label>
  <label>SH <select id="sh" aria-label="The view-dependent colour drawn: SH bands">
    <option value="0">0 (base colour)</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option></select></label>
  <label>Speed <select id="speed" aria-label="Playback speed">
    <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select></label>
  <button id="stats" type="button" aria-pressed="true">Stats</button>
  <button id="full" type="button">Full screen</button>
</div>
<button id="ui" type="button" aria-label="Show the controls">Controls</button>
<script type="module" src="./player.js"></script>
</body>
</html>
